backend:
  name: github
  repo: Felt-Ink/{{FAMILY_NAME}}
  branch: main
  base_url: https://auth.felt.ink
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "content/images"
public_folder: "/images"
collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "string", required: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
  - name: "pages"
    label: "Pages"
    files:
      - name: "homepage"
        label: "Homepage"
        file: "content/index.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
  - name: "settings"
    label: "Settings"
    files:
      - name: "passphrase"
        label: "Site Passphrase"
        file: "passphrase.yml"
        fields:
          - {label: "Passphrase", name: "passphrase", widget: "string"}
          - {label: "Hint", name: "hint", widget: "string"}
      - name: "site-title"
        label: "Blog Title"
        file: "site-title.yml"
        fields:
          - {label: "Title Type", name: "titleType", widget: "select", options: ["text", "image"], default: "text"}
          - {label: "Title Text", name: "titleText", widget: "string", required: false, hint: "Shown when Title Type is Text"}
          - {label: "Title Image", name: "titleImage", widget: "image", required: false, hint: "Shown when Title Type is Image — use a horizontal/rectangular logo, e.g. ~400x100px"}
          - {label: "Title Image Alt Text", name: "titleImageAlt", widget: "string", required: false, hint: "Accessible description of the image, also used as the site name in tab titles, RSS, and link previews"}